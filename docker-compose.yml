services:
  app:
    build:
      context: ./
    restart: always
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "/data/project/resonite-FE/config.json:/headlessConfig/resonite-fe.json"
      - "/data/project/resonite-FE-CFF/config.json:/headlessConfig/resonite-fe-cff.json"
      - "/data/project/resonite-FE-meditation/config.json:/headlessConfig/resonite-fe-meditation.json"
      - "/data/project/resonite-FE-fitness/config.json:/headlessConfig/resonite-fe-fitness.json"
      - "/data/project/resonite-MPAW/config.json:/headlessConfig/resonite-mpaw.json"
      - "/data/project/resonite-FE-test/config.json:/headlessConfig/resonite-fe-test.json"
    environment:
      # Timezone required for Discord events to be put into the correct day category, if they have the day in the title.
      TZ: Canada/Eastern
      DCtoken: ${DCtoken}
      uptimeUrl: ${uptimeUrl}
      redisHost: redis
  redis:
    image: redis
    restart: always
    expose:
      - 6379
